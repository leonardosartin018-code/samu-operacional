name: Testes do sistema SAMU
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe de módulos novos
        run: |
          node --check names-review.js
          node --check professional-functions.js
          node --check monthly-roster-match.js
      - name: Executar testes sem dados reais
        run: node --test tests/*.test.mjs
